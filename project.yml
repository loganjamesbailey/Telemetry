name: Telemetry

options:
  bundleIdPrefix: com.jamesbailey
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  TelemetryCore:
    path: Packages/TelemetryCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (gitignored) so that
    # anyone building from source signs with their own identity. App and helper
    # must share one Apple-issued identity — never ad-hoc.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  TelemetryWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: TelemetryCore
        product: TelemetryShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesbailey.telemetry.widget
        PRODUCT_NAME: TelemetryWidget
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Telemetry
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TelemetryHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - "*.plist"
    dependencies:
      - package: TelemetryCore
        product: SMCKit
      - package: TelemetryCore
        product: TelemetryShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesbailey.telemetry.helper
        PRODUCT_NAME: TelemetryHelper
        SKIP_INSTALL: YES
        # Command-line tools sign with PRODUCT_NAME as identifier by default;
        # the app pins the daemon by this exact identifier, so force it.
        OTHER_CODE_SIGN_FLAGS: "-i com.jamesbailey.telemetry.helper"
        # Root process: no GUI frameworks, hardened runtime, same identity as
        # the app (SMAppService hard requirement).

  Telemetry:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - target: TelemetryHelper
        embed: false
      - target: TelemetryWidget
        embed: true
      - package: TelemetryCore
        product: SMCKit
      - package: TelemetryCore
        product: HIDSensors
      - package: TelemetryCore
        product: TelemetryShared
    postBuildScripts:
      # Embed the daemon per SMAppService convention: binary in
      # Contents/MacOS (BundleProgram points there), launchd plist in
      # Contents/Library/LaunchDaemons. Runs before Xcode signs the app, so
      # both files are covered by the app's seal; the helper binary itself is
      # already signed by its own target build.
      - name: Embed TelemetryHelper daemon
        script: |
          set -euo pipefail
          APP="$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME"
          mkdir -p "$APP/Contents/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/TelemetryHelper" "$APP/Contents/MacOS/TelemetryHelper"
          cp "$SRCROOT/Helper/com.jamesbailey.telemetry.helper.plist" "$APP/Contents/Library/LaunchDaemons/"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/TelemetryHelper
          - $(SRCROOT)/Helper/com.jamesbailey.telemetry.helper.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FULL_PRODUCT_NAME)/Contents/MacOS/TelemetryHelper
          - $(BUILT_PRODUCTS_DIR)/$(FULL_PRODUCT_NAME)/Contents/Library/LaunchDaemons/com.jamesbailey.telemetry.helper.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesbailey.telemetry
        PRODUCT_NAME: Telemetry
        CODE_SIGN_ENTITLEMENTS: Config/Telemetry.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Telemetry
        CFBundleDisplayName: Telemetry
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        # Accessory app: menu bar only, no Dock icon. The dashboard window
        # flips the activation policy to .regular while it is open.
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
